<script>

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const params = new URLSearchParams(window.location.search);
let tmdbId = params.get('play');
if (tmdbId && typeof tmdbId === 'string' && tmdbId.startsWith('tmdb_')) {
    tmdbId = tmdbId.replace('tmdb_', '');
}
const tipo = params.get('tipo') || 'pelicula';
const tempRestaurar = params.get('temp') ? parseInt(params.get('temp')) : null;
const capRestaurar = params.get('cap') ? parseInt(params.get('cap')) : null;

let urlOp1 = null, urlOp2 = null, urlActual = null;
let opcion2Disponible = false, opcionActiva = 1;
let esSerie = false;
let temporadasActuales = [];
let tempActualIndex = 0;
let firebaseKeyActual = null;

console.log('📌 ID:', tmdbId, '| Tipo:', tipo);

function volverAlIndex() {
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    window.location.href = 'index.html';
}

function toggleFullscreen() {
    const w = document.getElementById('playerWrapper');
    if (!document.fullscreenElement) {
        if (w.requestFullscreen) w.requestFullscreen();
        else if (w.webkitRequestFullscreen) w.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
}

function irALogin() { window.location.href = 'login.html'; }
function cerrarSesion() { auth.signOut().then(() => { window.location.href = 'index.html'; }); }
function toggleUserMenu() { document.getElementById('userDropdown').classList.toggle('show'); }
document.addEventListener('click', (e) => {
    const menu = document.getElementById('userDropdown');
    if (menu && !e.target.closest('.user-menu')) menu.classList.remove('show');
});
auth.onAuthStateChanged(user => {
    document.getElementById('loginBtn').style.display = user ? 'none' : 'flex';
    document.getElementById('logoutBtn').style.display = user ? 'flex' : 'none';
});

function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById('themeBtn');
    if (body.classList.contains('dark')) {
        body.classList.remove('dark');
        btn.innerHTML = '<i class="fas fa-moon"></i>';
        localStorage.setItem('theme', 'light');
    } else {
        body.classList.add('dark');
        btn.innerHTML = '<i class="fas fa-sun"></i>';
        localStorage.setItem('theme', 'dark');
    }
}
if (localStorage.getItem('theme') === 'light') {
    document.body.classList.remove('dark');
    document.getElementById('themeBtn').innerHTML = '<i class="fas fa-moon"></i>';
} else {
    document.body.classList.add('dark');
    document.getElementById('themeBtn').innerHTML = '<i class="fas fa-sun"></i>';
}

function getImagenUrl(path, size = 'w342') {
    if (!path) return 'https://i.postimg.cc/8k4h4K7y/placeholder.jpg';
    if (path.startsWith('http')) return path;
    return `https://image.tmdb.org/t/p/${size}${path}`;
}

function mostrarToast(msg, tipo = 'success') {
    const colores = { success: '#10B981', warning: '#F59E0B', error: '#EF4444', info: '#3B82F6' };
    const t = document.createElement('div');
    t.style.cssText = `position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:${colores[tipo]||'#10B981'};color:#fff;padding:8px 16px;border-radius:10px;z-index:9999;font-weight:600;font-size:.75rem;max-width:92%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5);transition:opacity 0.3s;`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2200);
}

async function fetchTMDB(path, params = {}) {
    const q = new URLSearchParams({ path, ...params });
    const res = await fetch(`https://tely-xi.vercel.app/api/tmdb?${q}`);
    if (!res.ok) throw new Error(`Error ${res.status}`);
    return res.json();
}

function generarEnlaceUnlimplay(tmdb_id, tipo, temporada = 1, capitulo = 1) {
    const temp = parseInt(temporada) || 1;
    const cap = parseInt(capitulo) || 1;
    if (tipo === 'pelicula') {
        return `https://unlimplay.com/play/embed/movie/${tmdb_id}?lang=es-MX&autoplay=1&controls=1&logo=0`;
    } else {
        return `https://unlimplay.com/play/embed/tv/${tmdb_id}/${temp}/${cap}?lang=es-MX&autoplay=1&controls=1&logo=0`;
    }
}

async function obtenerOpcion2DesdeFirebase(tmdb_id, tipo, temporada = 1, capitulo = 1) {
    try {
        console.log('🔍 Buscando Opción 2 para:', tmdb_id, 'tipo:', tipo);
        if (tipo === 'pelicula') {
            const snap = await db.ref('contenido_personalizado').orderByChild('tmdb_id').equalTo(parseInt(tmdb_id)).once('value');
            const data = snap.val();
            if (data) {
                const keys = Object.keys(data);
                for (const key of keys) {
                    const item = data[key];
                    if (item.opcion2 && item.opcion2.trim() !== '' && item.opcion2.startsWith('http')) {
                        console.log('✅ Opción 2 encontrada:', item.opcion2);
                        firebaseKeyActual = key;
                        return item.opcion2;
                    }
                }
            }
            return null;
        } else {
            const snap = await db.ref('series_personalizadas').orderByChild('tmdb_id').equalTo(parseInt(tmdb_id)).once('value');
            const data = snap.val();
            if (data) {
                const keys = Object.keys(data);
                for (const key of keys) {
                    const serie = data[key];
                    firebaseKeyActual = key;
                    if (serie.opcion2 && serie.opcion2.trim() !== '' && serie.opcion2.startsWith('http')) return serie.opcion2;
                    if (serie.temporadas) {
                        for (const temp of serie.temporadas) {
                            if (temp.numero === parseInt(temporada) && temp.capitulos) {
                                for (const cap of temp.capitulos) {
                                    if (cap.numero === parseInt(capitulo) && cap.opcion2 && cap.opcion2.trim() !== '' && cap.opcion2.startsWith('http')) return cap.opcion2;
                                }
                            }
                        }
                    }
                }
            }
            return null;
        }
    } catch (error) {
        console.error('❌ Error Opción2:', error);
        return null;
    }
}

function reproducirDirecto(url) {
    if (!url) return;
    const wrapper = document.getElementById('playerWrapper');
    urlActual = url;
    let finalUrl = url;
    if (finalUrl.includes('unlimplay.com')) {
        if (!finalUrl.includes('autoplay')) finalUrl += finalUrl.includes('?') ? '&autoplay=1&controls=1&logo=0' : '?autoplay=1&controls=1&logo=0';
        if (finalUrl.includes('unlimplay.com/play/') && !finalUrl.includes('unlimplay.com/play/embed/')) finalUrl = finalUrl.replace('unlimplay.com/play/', 'unlimplay.com/play/embed/');
        finalUrl += '&t=' + Date.now();
    } else {
        finalUrl += (finalUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
    }
    const iframe = document.createElement('iframe');
    iframe.src = finalUrl;
    iframe.frameborder = "0";
    iframe.referrerpolicy = "no-referrer-when-downgrade";
    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowfullscreen = true;
    iframe.style.cssText = "width:100%;height:100%;border:none;background:#000;position:absolute;top:0;left:0;";
    iframe.loading = "eager";
    wrapper.innerHTML = '';
    wrapper.appendChild(iframe);
}

async function cargarPelicula() {
    try {
        urlOp1 = generarEnlaceUnlimplay(tmdbId, 'pelicula');
        if (urlOp1) { reproducirDirecto(urlOp1); document.getElementById('btnOp1').classList.add('active'); }
        const enlaceFirebase = await obtenerOpcion2DesdeFirebase(tmdbId, 'pelicula');
        if (enlaceFirebase) {
            urlOp2 = enlaceFirebase; opcion2Disponible = true; document.getElementById('btnOp2').classList.remove('hidden');
        } else {
            urlOp2 = null; opcion2Disponible = false; document.getElementById('btnOp2').classList.add('hidden');
        }
        const data = await fetchTMDB(`movie/${tmdbId}`);
        if (data && data.id) {
            document.getElementById('playerTitulo').textContent = data.title || 'Sin título';
            document.getElementById('playerAnio').textContent = data.release_date ? data.release_date.split('-')[0] : 'N/D';
            document.getElementById('playerRating').textContent = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            document.getElementById('playerGenero').textContent = data.genres ? data.genres.map(g => g.name).join(', ') : 'Película';
            document.getElementById('playerSinopsis').textContent = data.overview || 'Sin sinopsis';
            document.getElementById('playerTipo').textContent = '🎬 Película';
            document.getElementById('playerTipo').style.color = '#C4B5FD';
        }
        cargarRecomendacionesPelicula(tmdbId);
    } catch(e) { console.error('Error pelicula:', e); }
}

async function cargarSerie() {
    try {
        const data = await fetchTMDB(`tv/${tmdbId}`);
        if (!data || !data.id) {
            document.getElementById('playerWrapper').innerHTML = `<div class="error-video"><i class="fas fa-exclamation-triangle"></i><span>Serie no encontrada</span></div>`;
            return;
        }
        document.getElementById('playerTitulo').textContent = data.name || 'Sin título';
        document.getElementById('playerAnio').textContent = data.first_air_date ? data.first_air_date.split('-')[0] : 'N/D';
        document.getElementById('playerRating').textContent = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
        document.getElementById('playerGenero').textContent = data.genres ? data.genres.map(g => g.name).join(', ') : 'Serie';
        document.getElementById('playerSinopsis').textContent = data.overview || 'Sin sinopsis';
        document.getElementById('playerTipo').textContent = '📺 Serie';
        document.getElementById('playerTipo').style.color = '#6ee7b7';
        esSerie = true;
        temporadasActuales = [];
        const numTemps = Math.min(data.number_of_seasons || 1, 10);
        for (let t = 1; t <= numTemps; t++) {
            try {
                const seasonData = await fetchTMDB(`tv/${tmdbId}/season/${t}`);
                if (!seasonData || !seasonData.episodes) continue;
                const capitulos = seasonData.episodes.sort((a,b)=>a.episode_number-b.episode_number).map(ep=>({
                    numero: ep.episode_number, titulo: ep.name||`Capítulo ${ep.episode_number}`, sinopsis: ep.overview||'Sin sinopsis',
                    url: generarEnlaceUnlimplay(tmdbId,'serie',t,ep.episode_number), opcion2:null
                }));
                temporadasActuales.push({numero:t, nombre:seasonData.name||`Temporada ${t}`, capitulos});
            }catch(e){}
        }
        let tempIndex=0,capIndex=0;
        if(tempRestaurar!==null&&tempRestaurar<temporadasActuales.length) tempIndex=tempRestaurar;
        if(capRestaurar!==null&&temporadasActuales[tempIndex]?.capitulos?.length>capIndex) capIndex=capRestaurar;
        const temp = temporadasActuales[tempIndex];
        if(temp&&temp.capitulos&&temp.capitulos.length){
            const cap = temp.capitulos[capIndex]||temp.capitulos[0];
            const tempNum = temp.numero||1, capNum = cap.numero||1;
            urlOp1 = generarEnlaceUnlimplay(tmdbId,'serie',tempNum,capNum);
            const enlaceFirebase = await obtenerOpcion2DesdeFirebase(tmdbId,'serie',tempNum,capNum);
            if(enlaceFirebase){ urlOp2=enlaceFirebase; cap.opcion2=enlaceFirebase; opcion2Disponible=true; document.getElementById('btnOp2').classList.remove('hidden'); }
            else { urlOp2=null; opcion2Disponible=false; document.getElementById('btnOp2').classList.add('hidden'); }
            if(urlOp1){ reproducirDirecto(urlOp1); document.getElementById('btnOp1').classList.add('active'); }
        }
        if(temporadasActuales.length) mostrarEpisodiosConTemporadas(temporadasActuales);
        cargarRecomendacionesSerie(tmdbId);
    } catch(e) {
        console.error('Error serie:',e);
        document.getElementById('playerWrapper').innerHTML = `<div class="error-video"><i class="fas fa-exclamation-triangle"></i><span>Error al cargar la serie</span><span class="sub">${e.message}</span></div>`;
    }
}

function mostrarEpisodiosConTemporadas(temporadas) {
    if(!temporadas||!temporadas.length) return;
    document.getElementById('episodiosSection').style.display = 'block';
    const select = document.getElementById('tempSelect');
    select.innerHTML = '';
    temporadas.forEach((t,idx)=>{
        const opt = document.createElement('option'); opt.value=idx; opt.textContent=`Temporada ${t.numero}`; select.appendChild(opt);
    });
    let tempIndex=0;
    if(tempRestaurar!==null&&tempRestaurar<temporadas.length) tempIndex=tempRestaurar;
    select.value=tempIndex; tempActualIndex=tempIndex; mostrarEpisodios(tempIndex);
}

async function mostrarEpisodios(tempIndex, capSeleccionado=0) {
    if(!temporadasActuales[tempIndex]) return;
    const temp = temporadasActuales[tempIndex];
    const container = document.getElementById('episodiosList'); container.innerHTML='';
    if(!temp.capitulos||!temp.capitulos.length){ container.innerHTML='<p style="color:#94a3b8;padding:.4rem;text-align:center;font-size:.75rem;">Sin capítulos disponibles</p>'; return; }
    const capitulosOrdenados = [...temp.capitulos].sort((a,b)=>a.numero-b.numero);
    const tempNum = temp.numero||1;
    capitulosOrdenados.forEach((cap,idx)=>{
        const d = document.createElement('div'); d.className='ep-item'; if(idx===capSeleccionado) d.classList.add('active');
        const capNum = cap.numero||idx+1;
        const tieneOp2 = cap.opcion2 && cap.opcion2.trim()!=='' && cap.opcion2.startsWith('http');
        d.innerHTML = `<div class="ep-top"><span class="ep-num">${capNum}.</span><span class="ep-title">${cap.titulo||'Episodio '+capNum}</span>${tieneOp2?'<span class="badge-ep-alt">Opción2</span>':''}</div><div class="ep-desc">${cap.sinopsis||''}</div>`;
        d.onclick = async ()=>{
            if(!cap.url){ mostrarToast('❌ Sin enlace disponible','error'); return; }
            document.querySelectorAll('.ep-item').forEach(el=>el.classList.remove('active')); d.classList.add('active');
            const tN = temp.numero||1, cN = cap.numero||idx+1;
            urlOp1 = generarEnlaceUnlimplay(tmdbId,'serie',tN,cN);
            const enlaceFirebase = await obtenerOpcion2DesdeFirebase(tmdbId,'serie',tN,cN);
            if(enlaceFirebase){ urlOp2=enlaceFirebase; cap.opcion2=enlaceFirebase; opcion2Disponible=true; document.getElementById('btnOp2').classList.remove('hidden'); }
            else { urlOp2=null; opcion2Disponible=false; document.getElementById('btnOp2').classList.add('hidden'); }
            if(opcionActiva===2&&!opcion2Disponible){ opcionActiva=1; document.getElementById('btnOp1').classList.add('active'); document.getElementById('btnOp2').classList.remove('active'); }
            if(opcionActiva===2&&opcion2Disponible&&urlOp2) reproducirDirecto(urlOp2); else reproducirDirecto(urlOp1);
        };
        container.appendChild(d);
    });
}

function cambiarTempSelect() {
    const select = document.getElementById('tempSelect');
    const idx = parseInt(select.value); tempActualIndex=idx; mostrarEpisodios(idx,0);
}

function reproducirOpcion(opcion) {
    if(opcion===1&&urlOp1){ opcionActiva=1; document.getElementById('btnOp1').classList.add('active'); document.getElementById('btnOp2').classList.remove('active'); reproducirDirecto(urlOp1); }
    else if(opcion===2&&opcion2Disponible&&urlOp2){ opcionActiva=2; document.getElementById('btnOp2').classList.add('active'); document.getElementById('btnOp1').classList.remove('active'); reproducirDirecto(urlOp2); }
    else mostrarToast('❌ Opción no disponible','error');
}

function recargarVideo() { if(urlActual){ mostrarToast('🔄 Recargando…','info'); reproducirDirecto(urlActual); } else mostrarToast('❌ No hay video activo','error'); }
function abrirNuevaVentana() { if(urlActual) window.open(urlActual,'_blank'); else mostrarToast('❌ No hay enlace','error'); }
function reportarFalla() { mostrarToast('📋 Reporte enviado','success'); }
function ayuda() { mostrarToast('💬 Contáctanos para ayuda','info'); }

        container.innerHTML='';

function detectarPlataforma() {
    const ua = navigator.userAgent || '';
    const esWebView = /wv|WebView|Android.*(wv|WebView)/i.test(ua);
    const esNavegador = !esWebView && /Android|iPhone|iPad|iPod/i.test(ua);
    return { esWebView, esNavegador };
}
function mostrarBannerApp() {
    const banner = document.getElementById('bannerApp');
    if(!banner) return;
    if(localStorage.getItem('bannerAppCerrado')==='true') return;
    const { esNavegador } = detectarPlataforma();
    if(esNavegador){ banner.style.display='block'; document.body.classList.add('banner-activo'); }
}
function cerrarBannerApp() {

}
