<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080610">
<title>TELY | Reproductor</title>

<style>
:root {
    --fondo: #080610;
    --panel: #120d20;
    --morado: #7c3aed;
    --morado-claro: #a78bfa;
    --texto: #ffffff;
    --secundario: #aaa3ba;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--fondo);
    color: var(--texto);
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    background: #0c0815;
    border-bottom: 1px solid #241936;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    color: var(--morado-claro);
    letter-spacing: 2px;
}

header a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

#titulo {
    font-size: 24px;
    margin: 18px 0 8px;
}

#descripcion {
    color: var(--secundario);
    line-height: 1.5;
    font-size: 14px;
    margin-bottom: 18px;
}

.reproductor {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 1px solid #302044;
}

.reproductor iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

.controles {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 14px 0 22px;
}

button, select {
    background: var(--panel);
    border: 1px solid #38234f;
    color: white;
    padding: 12px 15px;
    border-radius: 9px;
    font-size: 14px;
}

button {
    cursor: pointer;
}

button:hover {
    background: var(--morado);
}

h2 {
    font-size: 19px;
    margin: 24px 0 12px;
}

#temporadas, #episodios, #recomendaciones {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
    gap: 10px;
}

.item {
    background: var(--panel);
    border: 1px solid #2b1c3d;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
}

.item img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #21172d;
}

.item p {
    font-size: 13px;
    padding: 10px;
    line-height: 1.4;
}

.item.activo {
    border-color: var(--morado-claro);
    box-shadow: 0 0 12px #7c3aed55;
}

.estado {
    color: var(--secundario);
    font-size: 13px;
    margin: 12px 0;
}

#error {
    display: none;
    padding: 14px;
    margin: 14px 0;
    background: #351321;
    border: 1px solid #7f1d3c;
    border-radius: 10px;
    color: #fecdd3;
}

@media (max-width: 600px) {
    main {
        padding: 12px;
    }

    #titulo {
        font-size: 21px;
    }

    .reproductor {
        border-radius: 8px;
    }

    #temporadas, #episodios, #recomendaciones {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    button, select {
        padding: 11px;
    }
}
</style>
</head>

<body>
<header>
    <div class="logo">TELY</div>
    <a href="index.html">← Volver al inicio</a>
</header>

<main>
    <div id="error"></div>

    <div class="reproductor" id="playerWrapper">
        <iframe
            id="player"
            src="about:blank"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen
            referrerpolicy="origin"
            title="Reproductor de vídeo">
        </iframe>
    </div>

    <div class="controles">
        <button onclick="pantallaCompleta()">⛶ Pantalla completa</button>
        <button onclick="cargarReproduccion()">↻ Recargar vídeo</button>
    </div>

    <h1 id="titulo">Cargando contenido...</h1>
    <p id="descripcion"></p>
    <p class="estado" id="estado">Preparando reproductor...</p>

    <section id="seccionTemporadas" hidden>
        <h2>Temporadas</h2>
        <div id="temporadas"></div>
    </section>

    <section id="seccionEpisodios" hidden>
        <h2>Episodios</h2>
        <div id="episodios"></div>
    </section>

    <section>
        <h2>También te puede gustar</h2>
        <div id="recomendaciones"></div>
    </section>
</main>

<script>
const API_TMDB = "https://tely-xi.vercel.app/api/tmdb";

const parametros = new URLSearchParams(location.search);
const tmdbId = parametros.get("play");
const tipo = parametros.get("tipo") || "movie";

let contenidoActual = null;
let temporadaActual = 1;
let episodioActual = 1;

async function fetchTMDB(path, params = {}) {
    const query = new URLSearchParams({
        path,
        ...params
    });

    const respuesta = await fetch(`${API_TMDB}?${query}`);

    if (!respuesta.ok) {
        throw new Error(`Error al consultar el contenido (${respuesta.status})`);
    }

    return respuesta.json();
}

function mostrarError(mensaje) {
    const elemento = document.getElementById("error");
    elemento.textContent = mensaje;
    elemento.style.display = "block";
}

function ocultarError() {
    document.getElementById("error").style.display = "none";
}

function imagenTMDB(ruta, tamano = "w342") {
    return ruta
        ? `https://image.tmdb.org/t/p/${tamano}${ruta}`
        : "";
}

function textoSeguro(valor) {
    return valor || "Información no disponible.";
}

function cambiarVideo(url) {
    document.getElementById("player").src = url;
    document.getElementById("estado").textContent =
        "Si el vídeo no carga, prueba recargarlo o seleccionar otra opción.";
}

function cargarReproduccion() {
    const iframe = document.getElementById("player");
    const actual = iframe.src;
    iframe.src = "about:blank";

    setTimeout(() => {
        iframe.src = actual;
    }, 150);
}

function pantallaCompleta() {
    const elemento = document.getElementById("playerWrapper");

    if (elemento.requestFullscreen) {
        elemento.requestFullscreen();
    } else if (elemento.webkitRequestFullscreen) {
        elemento.webkitRequestFullscreen();
    }
}

async function cargarContenido() {
    if (!tmdbId) {
        document.getElementById("titulo").textContent = "Contenido no especificado";
        document.getElementById("estado").textContent =
            "Abre una película o serie desde el catálogo.";
        mostrarError("Falta el parámetro play en la dirección de la página.");
        return;
    }

    try {
        ocultarError();

        if (tipo === "tv" || tipo === "serie") {
            await cargarSerie();
        } else {
            await cargarPelicula();
        }
    } catch (error) {
        console.error(error);
        mostrarError("No se pudo cargar el contenido. Inténtalo de nuevo.");
        document.getElementById("estado").textContent =
            "Comprueba tu conexión e inténtalo otra vez.";
    }
}

async function cargarPelicula() {
    const pelicula = await fetchTMDB(`movie/${tmdbId}`, {
        language: "es-ES"
    });

    contenidoActual = pelicula;

    document.getElementById("titulo").textContent =
        pelicula.title || pelicula.original_title || "Película";

    document.getElementById("descripcion").textContent =
        textoSeguro(pelicula.overview);

    cambiarVideo(`https://unlimplay.com/movie/${tmdbId}`);

    await cargarRecomendaciones("movie");
}

async function cargarSerie() {
    const serie = await fetchTMDB(`tv/${tmdbId}`, {
        language: "es-ES"
    });

    contenidoActual = serie;

    document.getElementById("titulo").textContent =
        serie.name || serie.original_name || "Serie";

    document.getElementById("descripcion").textContent =
        textoSeguro(serie.overview);

    document.getElementById("seccionTemporadas").hidden = false;

    mostrarTemporadas(serie.seasons || []);

    const temporadaParam = parseInt(parametros.get("temp"), 10);
    const episodioParam = parseInt(parametros.get("cap"), 10);

    if (Number.isInteger(temporadaParam) && temporadaParam > 0) {
        temporadaActual = temporadaParam;
    }

    if (Number.isInteger(episodioParam) && episodioParam > 0) {
        episodioActual = episodioParam;
    }

    await cargarEpisodios(temporadaActual);
    await cargarRecomendaciones("tv");
}

function mostrarTemporadas(lista) {
    const contenedor = document.getElementById("temporadas");
    contenedor.innerHTML = "";

    lista
        .filter(temporada => temporada.season_number > 0)
        .forEach(temporada => {
            const tarjeta = document.createElement("div");
            tarjeta.className = "item";

            const imagen = document.createElement("img");
            imagen.src = imagenTMDB(temporada.poster_path);
            imagen.alt = temporada.name || "Temporada";

            const texto = document.createElement("p");
            texto.textContent = temporada.name ||
                `Temporada ${temporada.season_number}`;

            tarjeta.append(imagen, texto);
            tarjeta.addEventListener("click", () => {
                temporadaActual = temporada.season_number;
                episodioActual = 1;
                cargarEpisodios(temporadaActual);
            });

            contenedor.appendChild(tarjeta);
        });
}

async function cargarEpisodios(numeroTemporada) {
    try {
        const datos = await fetchTMDB(
            `tv/${tmdbId}/season/${numeroTemporada}`,
            { language: "es-ES" }
        );

        const contenedor = document.getElementById("episodios");
        contenedor.innerHTML = "";
        document.getElementById("seccionEpisodios").hidden = false;

        (datos.episodes || []).forEach(episodio => {
            const tarjeta = document.createElement("div");
            tarjeta.className = "item";

            const imagen = document.createElement("img");
            imagen.src = imagenTMDB(episodio.still_path);
            imagen.alt = episodio.name || "Episodio";

            const texto = document.createElement("p");
            texto.textContent =
                `${episodio.episode_number}. ${episodio.name || "Episodio"}`;

            tarjeta.append(imagen, texto);

            tarjeta.addEventListener("click", () => {
                episodioActual = episodio.episode_number;
                reproducirEpisodio(numeroTemporada, episodio.episode_number);
            });

            contenedor.appendChild(tarjeta);
        });

        const episodioExiste = (datos.episodes || []).some(
            episodio => episodio.episode_number === episodioActual
        );

        if (episodioExiste) {
            reproducirEpisodio(numeroTemporada, episodioActual);
        } else if ((datos.episodes || []).length) {
            reproducirEpisodio(numeroTemporada, datos.episodes[0].episode_number);
        }
    } catch (error) {
        console.error(error);
        mostrarError("No se pudieron cargar los episodios de esta temporada.");
    }
}

function reproducirEpisodio(temporada, episodio) {
    temporadaActual = temporada;
    episodioActual = episodio;

    cambiarVideo(
        `https://unlimplay.com/tv/${tmdbId}/${temporada}/${episodio}`
    );

    const nuevaURL = new URL(location.href);
    nuevaURL.searchParams.set("temp", temporada);
    nuevaURL.searchParams.set("cap", episodio);

    history.replaceState({}, "", nuevaURL);
}

async function cargarRecomendaciones(tipoContenido) {
    try {
        const datos = await fetchTMDB(
            `${tipoContenido}/${tmdbId}/recommendations`,
            { language: "es-ES" }
        );

        const contenedor = document.getElementById("recomendaciones");
        contenedor.innerHTML = "";

        (datos.results || []).slice(0, 12).forEach(item => {
            const tarjeta = document.createElement("div");
            tarjeta.className = "item";

            const imagen = document.createElement("img");
            imagen.src = imagenTMDB(item.poster_path);
            imagen.alt = item.title || item.name || "Contenido";

            const texto = document.createElement("p");
            texto.textContent = item.title || item.name || "Ver contenido";

            tarjeta.append(imagen, texto);

            tarjeta.addEventListener("click", () => {
                const nuevaURL = new URL("reproductor.html", location.href);
                nuevaURL.searchParams.set("play", item.id);
                nuevaURL.searchParams.set("tipo", tipoContenido);
                location.href = nuevaURL.href;
            });

            contenedor.appendChild(tarjeta);
        });
    } catch (error) {
        console.warn("No se pudieron cargar las recomendaciones:", error);
    }
}

cargarContenido();
</script>
</body>
</html>
