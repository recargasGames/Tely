<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>TELY 🎬 - Reproductor</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
 --bg:#0A0A0F;--panel:#12121c;--purple:#7C3AED;--light:#A78BFA;
 --text:#fff;--muted:#94A3B8;--border:rgba(124,58,237,.18)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--light);outline-offset:2px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--purple);border-radius:10px}
.main-content{width:100%;max-width:760px;min-height:100vh;margin:auto;padding:0 12px 24px}
.header-flotante{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.94);backdrop-filter:blur(14px);padding:10px 2px;border-bottom:1px solid var(--border)}
.top-header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-size:25px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#7C3AED,#C4B5FD);background-clip:text;-webkit-background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:7px}
.icon-btn,.user-btn{width:36px;height:36px;flex-shrink:0;border-radius:50%;border:1px solid var(--border);background:#ffffff08;color:white;display:flex;align-items:center;justify-content:center}
.icon-btn:hover,.user-btn:hover{background:#7C3AED33}
.btn-fullscreen,.btn-opcion,.btn-recargar,.btn-nueva-ventana{border:1px solid var(--border);background:#ffffff09;color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-fullscreen:hover,.btn-opcion:hover{border-color:var(--purple)}
.user-menu{position:relative}
.user-btn{font-size:17px}
.user-dropdown{position:absolute;right:0;top:44px;width:170px;background:#1a1a2e;border:1px solid var(--border);border-radius:10px;padding:5px 0;display:none;z-index:100;box-shadow:0 15px 35px #0008}
.user-dropdown.show{display:block}
.user-dropdown a{display:flex;gap:9px;align-items:center;padding:11px;color:#ddd;text-decoration:none;font-size:13px}
.user-dropdown a:hover{background:#7c3aed22}
.user-dropdown hr{border:0;border-top:1px solid var(--border)}
.info-top{padding:15px 0 9px}
.info-top h1{font-size:clamp(20px,5vw,27px);line-height:1.2;font-weight:800;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 0}
.rating{color:#FBBF24;font-weight:700}
.tipo-tag{color:var(--light)}
.sinopsis{font-size:13px;color:#a5a5b8;line-height:1.55}
.player-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #30233f;border-radius:12px;overflow:hidden;margin:8px 0}
.player-wrapper iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.player-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#050508;color:#b6a8d5;text-align:center;padding:18px}
.player-placeholder i{font-size:35px;color:var(--light)}
.player-placeholder p{font-size:13px;line-height:1.5}
.player-controls{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}
.btn-opcion.active{background:var(--purple);border-color:var(--purple)}
.btn-opcion.opcion2{border-color:#3b82f655;color:#60A5FA;background:#3b82f614}
.btn-opcion.opcion2.active{background:#2563eb;color:white;border-color:#2563eb}
.oculto{display:none!important}
.badge-opcion2{font-size:9px;background:#FBBF24;color:#111;padding:2px 5px;border-radius:4px;margin-left:3px}
.btn-recargar{background:#10b98115;border-color:#10b98145;color:#34D399}
.btn-nueva-ventana{background:#ef444410;border-color:#ef444433;color:#F87171}
.estado-carga{font-size:12px;color:var(--muted);margin:6px 0 12px;line-height:1.5}
.alerta{display:none;padding:12px;margin:10px 0;background:#351321;border:1px solid #7f1d3c;color:#fecdd3;border-radius:10px;font-size:13px;line-height:1.5}
.episodios-section{margin-top:12px;background:#ffffff04;border:1px solid var(--border);border-radius:12px;padding:12px}
.section-header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.section-header h3,.titulo-recomendadas{font-size:15px;font-weight:800}
.temp-selector select{max-width:190px;background:#171321;color:#fff;border:1px solid var(--border);border-radius:7px;padding:8px;font-size:12px}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
.acciones button{background:#ffffff08;border:1px solid var(--border);border-radius:7px;color:#c4b5fd;padding:7px 9px;font-size:11px}
.episodios-list{display:flex;flex-direction:column;gap:7px;max-height:360px;overflow-y:auto}
.episodio-item{padding:10px;background:#ffffff04;border:1px solid transparent;border-radius:8px;cursor:pointer}
.episodio-item:hover{background:#ffffff0a}
.episodio-item.activo{border-color:var(--purple);background:#7c3aed18}
.ep-top{display:flex;align-items:flex-start;gap:8px}
.ep-numero{color:var(--light);font-size:12px;font-weight:800;white-space:nowrap}
.ep-titulo{font-size:12px;color:#eee;font-weight:600;flex:1}
.ep-estado{font-size:10px;color:#34D399}
.ep-sinopsis{font-size:11px;color:#85859b;line-height:1.4;margin:5px 0 0 32px}
.recomendaciones-wrap{margin-top:18px}
.titulo-recomendadas{margin-bottom:10px}
.recomendaciones{display:flex;gap:10px;overflow-x:auto;padding:3px 1px 12px;scrollbar-width:thin}
.recomendacion{flex:0 0 100px;cursor:pointer;background:#ffffff05;border:1px solid transparent;border-radius:9px;overflow:hidden}
.recomendacion:hover{border-color:var(--purple)}
.recomendacion img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#171321}
.recomendacion p{padding:7px;font-size:11px;color:#ccc;line-height:1.35}
.empty{font-size:12px;color:#777;padding:12px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10B981;color:white;padding:11px 16px;border-radius:9px;z-index:9999;font-size:12px;font-weight:700;max-width:90%;box-shadow:0 6px 24px #0008}
#bannerApp{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:#171321;border-top:2px solid var(--purple);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -5px 25px #0008}
.banner-inner{max-width:700px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner-brand{display:flex;align-items:center;gap:9px;min-width:0}
.banner-logo-img{width:35px;height:35px;object-fit:cover;border-radius:8px}
.banner-title{font-size:12px;font-weight:800}
.banner-sub{font-size:10px;color:var(--muted);margin-top:3px}
.banner-buttons{display:flex;align-items:center;gap:6px}
.banner-install-btn{background:linear-gradient(135deg,#7C3AED,#A78BFA);border:0;color:white;padding:9px 11px;border-radius:7px;font-weight:800;font-size:11px;white-space:nowrap}
.banner-close{background:#ffffff12;color:#ddd;border:0;border-radius:7px;padding:9px}
body.banner-activo .main-content{padding-bottom:100px}
#playerWrapper:fullscreen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;border:0;border-radius:0;margin:0}
#playerWrapper:fullscreen iframe{width:100%;height:100%}
#playerWrapper:fullscreen .player-placeholder{height:100%}
@media(max-width:480px){
 .main-content{padding-left:10px;padding-right:10px}
 .brand{font-size:22px}
 .top-actions{gap:5px}
 .icon-btn,.user-btn{width:33px;height:33px}
 .btn-fullscreen{padding:8px 9px;font-size:11px}
 .player-wrapper{border-radius:9px}
 .recomendacion{flex-basis:84px}
 .episodios-section{padding:10px}
}
@media(min-width:600px){
 .main-content{padding-left:18px;padding-right:18px}
 .recomendacion{flex-basis:115px}
}
</style>
</head>

<body>
<main class="main-content">
 <header class="header-flotante">
  <div class="top-header">
   <div class="brand"><i class="fas fa-play"></i> TELY</div>
   <div class="top-actions">
    <button class="icon-btn" onclick="volverAlIndex()" aria-label="Volver"><i class="fas fa-arrow-left"></i></button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Cambiar tema"><i class="fas fa-moon"></i></button>
    <button class="btn-fullscreen" onclick="toggleFullscreen()"><i class="fas fa-expand"></i><span>Pantalla completa</span></button>
    <div class="user-menu">
     <button class="user-btn" onclick="toggleUserMenu()" aria-label="Cuenta"><i class="fas fa-user-circle"></i></button>
     <div class="user-dropdown" id="userDropdown">
      <a href="perfil.html"><i class="fas fa-user"></i> Mi perfil</a>
      <hr>
      <a href="login.html" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Iniciar sesión</a>
      <a href="#" id="logoutBtn" style="display:none" onclick="cerrarSesion(event)"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
     </div>
    </div>
   </div>
  </div>
 </header>

 <div id="alerta" class="alerta"></div>

 <section class="info-top">
  <h1 id="playerTitulo">Cargando contenido...</h1>
  <div class="meta">
   <span id="playerAnio">—</span>
   <span class="rating">⭐ <span id="playerRating">—</span></span>
   <span id="playerGenero">—</span>
   <span class="tipo-tag" id="playerTipo">🎬</span>
  </div>
  <p class="sinopsis" id="playerSinopsis">Cargando información...</p>
 </section>

 <div class="player-wrapper" id="playerWrapper">
  <div class="player-placeholder" id="playerPlaceholder">
   <i class="fas fa-circle-notch fa-spin"></i>
   <p>Preparando reproductor...</p>
  </div>
 </div>

 <div class="player-controls">
  <button class="btn-opcion active" id="btnOp1" onclick="reproducirOpcion(1)"><i class="fas fa-play"></i> Opción 1</button>
  <button class="btn-opcion opcion2 oculto" id="btnOp2" onclick="reproducirOpcion(2)"><i class="fas fa-play"></i> Opción 2 <span class="badge-opcion2">ALTERNATIVA</span></button>
  <button class="btn-recargar" onclick="recargarVideo()" aria-label="Recargar vídeo"><i class="fas fa-rotate"></i> Recargar</button>
  <button class="btn-nueva-ventana" onclick="abrirNuevaVentana()"><i class="fas fa-external-link-alt"></i> Abrir aparte</button>
 </div>
 <p class="estado-carga" id="estadoCarga">Cargando enlaces de reproducción...</p>

 <section class="episodios-section" id="episodiosSection" style="display:none">
  <div class="section-header">
   <h3><i class="fas fa-list"></i> Episodios</h3>
   <div class="temp-selector"><select id="tempSelect" onchange="cambiarTempSelect()"></select></div>
   <div class="acciones">
    <button onclick="reportarFalla()"><i class="fas fa-flag"></i> Reportar</button>
    <button onclick="ayuda()"><i class="fas fa-question-circle"></i> Ayuda</button>
   </div>
  </div>
  <div class="episodios-list" id="episodiosList"></div>
 </section>

 <section class="recomendaciones-wrap">
  <h2 class="titulo-recomendadas">Te podría gustar</h2>
  <div class="recomendaciones" id="recomendaciones"></div>
 </section>
</main>

<div id="bannerApp">
 <div class="banner-inner">
  <div class="banner-brand">
   <img src="logo.png" alt="TELY" class="banner-logo-img" onerror="this.style.display='none'">
   <div><div class="banner-title">📱 ¿Quieres instalar TELY?</div><div class="banner-sub">Mejor experiencia en tu teléfono</div></div>
  </div>
  <div class="banner-buttons">
   <button class="banner-install-btn" onclick="descargarAPK()"><i class="fas fa-download"></i> Instalar</button>
   <button class="banner-close" onclick="cerrarBannerApp()" aria-label="Cerrar"><i class="fas fa-times"></i></button>
  </div>
 </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
"use strict";

/* FIREBASE: conserva el proyecto original */
const firebaseConfig = {
 apiKey:"AIzaSyDSCjhkZBmBfpgsyLPdN50ISvgvzfGRH2Q",
 authDomain:"tely-c9776.firebaseapp.com",
 projectId:"tely-c9776",
 storageBucket:"tely-c9776.firebasestorage.app",
 messagingSenderId:"185494855835",
 appId:"1:185494855835:web:cb113139c6d5aeb472263e",
 measurementId:"G-KTDT3WS0PP"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const API_TMDB = "https://tely-xi.vercel.app/api/tmdb";

const params = new URLSearchParams(location.search);
let tmdbId = params.get("play");
if (tmdbId && tmdbId.startsWith("tmdb_")) tmdbId = tmdbId.replace("tmdb_","");
const tipoParametro = (params.get("tipo") || "pelicula").toLowerCase();
let esSerie = ["tv","serie","series","show"].includes(tipoParametro);
let temporadaActual = parseInt(params.get("temp") || "1",10);
let episodioActual = parseInt(params.get("cap") || "1",10);
if (!Number.isFinite(temporadaActual) || temporadaActual < 1) temporadaActual = 1;
if (!Number.isFinite(episodioActual) || episodioActual < 1) episodioActual = 1;

let contenidoActual = null;
let urlOp1 = null, urlOp2 = null, urlActual = null;
let opcion2Disponible = false, opcionActiva = 1;
let temporadasActuales = [];
let episodiosActuales = [];
let recomendacionesActuales = [];
let firebaseKeyActual = null;
let registroPersonalizado = null;
let ultimaCargaId = 0;

const PLACEHOLDER = "https://image.tmdb.org/t/p/w342";
const $ = id => document.getElementById(id);

function volverAlIndex(){
 if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
 location.href = "index.html";
}
function toggleFullscreen(){
 const wrapper = $("playerWrapper");
 if(!document.fullscreenElement){
  const fn = wrapper.requestFullscreen || wrapper.webkitRequestFullscreen;
  if(fn){ const p = fn.call(wrapper); if(p && p.catch) p.catch(()=>mostrarToast("No se pudo activar pantalla completa","error")); }
  else mostrarToast("Tu navegador no permite pantalla completa","warning");
 }else{
  const fn = document.exitFullscreen || document.webkitExitFullscreen;
  if(fn) fn.call(document).catch?.(()=>{});
 }
}
function toggleUserMenu(){ $("userDropdown").classList.toggle("show"); }
document.addEventListener("click",e=>{
 if(!e.target.closest(".user-menu")) $("userDropdown").classList.remove("show");
});
function irALogin(){ location.href="login.html"; }
async function cerrarSesion(e){
 if(e) e.preventDefault();
 try{ await auth.signOut(); location.href="index.html"; }
 catch(err){ mostrarToast("No se pudo cerrar sesión","error"); }
}
auth.onAuthStateChanged(user=>{
 $("loginBtn").style.display=user?"none":"flex";
 $("logoutBtn").style.display=user?"flex":"none";
});

function toggleTheme(){
 const light=document.body.classList.toggle("tema-claro");
 localStorage.setItem("tely-player-theme",light?"light":"dark");
 aplicarTema();
}
function aplicarTema(){
 const light=localStorage.getItem("tely-player-theme")==="light";
 document.body.classList.toggle("tema-claro",light);
 $("themeBtn").innerHTML=light?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';
}
(function instalarTemaClaro(){
 const style=document.createElement("style");
 style.textContent=`body.tema-claro{--bg:#f5f3fa;--text:#171322;color:#171322}
 body.tema-claro .header-flotante{background:#f5f3faed}
 body.tema-claro .info-top h1,body.tema-claro .section-header h3,body.tema-claro .titulo-recomendadas{color:#171322}
 body.tema-claro .sinopsis,body.tema-claro .meta{color:#625b70}
 body.tema-claro .episodios-section,body.tema-claro .episodio-item,body.tema-claro .recomendacion{background:#fff}
 body.tema-claro .ep-titulo,body.tema-claro .recomendacion p{color:#272033}
 body.tema-claro .icon-btn,body.tema-claro .user-btn,body.tema-claro .btn-opcion{color:#272033;background:#fff}`;
 document.head.appendChild(style);
})();
aplicarTema();

function getImagenUrl(path,size="w342"){
 if(!path) return "https://placehold.co/342x513/171321/a78bfa?text=TELY";
 if(/^https?:\/\//i.test(path)) return path;
 return `https://image.tmdb.org/t/p/${size}${path}`;
}
function mostrarToast(msg,tipo="success"){
 const colores={success:"#059669",warning:"#D97706",error:"#DC2626",info:"#2563EB"};
 const t=document.createElement("div");
 t.className="toast";t.style.background=colores[tipo]||colores.success;t.textContent=msg;
 document.body.appendChild(t);
 setTimeout(()=>t.remove(),2800);
}
function mostrarAlerta(msg){
 $("alerta").textContent=msg;
 $("alerta").style.display="block";
}
function ocultarAlerta(){ $("alerta").style.display="none"; }
function actualizarEstado(msg){ $("estadoCarga").textContent=msg; }

async function fetchTMDB(path,extra={}){
 const query=new URLSearchParams({path,...extra});
 const response=await fetch(`${API_TMDB}?${query.toString()}`,{headers:{Accept:"application/json"}});
 if(!response.ok) throw new Error(`TMDB respondió ${response.status}`);
 return response.json();
}
function generarEnlaceUnlimplay(id,tipoContenido,temp=1,cap=1){
 const t=parseInt(temp,10)||1,c=parseInt(cap,10)||1;
 if(tipoContenido==="pelicula"){
  return `https://unlimplay.com/play/embed/movie/${encodeURIComponent(id)}?lang=es-MX&autoplay=1&controls=1&logo=0`;
 }
 return `https://unlimplay.com/play/embed/tv/${encodeURIComponent(id)}/${t}/${c}?lang=es-MX&autoplay=1&controls=1&logo=0`;
}
function renderPlayer(url){
 const wrapper=$("playerWrapper");
 wrapper.innerHTML="";
 if(!url){
  wrapper.innerHTML='<div class="player-placeholder"><i class="fas fa-video-slash"></i><p>No hay un enlace de reproducción disponible.</p></div>';
  return;
 }
 const iframe=document.createElement("iframe");
 iframe.src=url;
 iframe.title="Reproductor TELY";
 iframe.allow="autoplay; fullscreen; encrypted-media; picture-in-picture";
 iframe.allowFullscreen=true;
 iframe.referrerPolicy="origin";
 iframe.setAttribute("loading","eager");
 wrapper.appendChild(iframe);
 urlActual=url;
}
function reproducirOpcion(n){
 if(n===2 && !opcion2Disponible){mostrarToast("La opción 2 no está disponible","warning");return;}
 opcionActiva=n;
 const url=n===2?urlOp2:urlOp1;
 if(!url){mostrarToast("No hay enlace para esta opción","error");return;}
 $("btnOp1").classList.toggle("active",n===1);
 $("btnOp2").classList.toggle("active",n===2);
 renderPlayer(url);
 actualizarEstado(n===1?"Reproduciendo con la opción 1.":"Reproduciendo con la opción 2.");
}
function recargarVideo(){
 if(!urlActual){mostrarToast("Todavía no hay vídeo para recargar","warning");return;}
 const url=urlActual;
 renderPlayer("about:blank");
 setTimeout(()=>renderPlayer(url),120);
 mostrarToast("Reproductor recargado","info");
}
function abrirNuevaVentana(){
 if(!urlActual){mostrarToast("No hay ningún enlace disponible","warning");return;}
 const win=window.open(urlActual,"_blank","noopener,noreferrer");
 if(!win) mostrarToast("El navegador bloqueó la ventana emergente","warning");
}
function prepararOpciones(urlPrincipal,urlAlternativo){
 urlOp1=urlPrincipal||null;
 urlOp2=urlAlternativo||null;
 opcion2Disponible=Boolean(urlOp2 && urlOp2!==urlOp1);
 $("btnOp2").classList.toggle("oculto",!opcion2Disponible);
 $("btnOp1").classList.toggle("active",true);
 $("btnOp2").classList.remove("active");
 opcionActiva=1;
 if(urlOp1) renderPlayer(urlOp1);
 else{
  $("playerWrapper").innerHTML='<div class="player-placeholder"><i class="fas fa-video-slash"></i><p>No se encontró un enlace de reproducción.</p></div>';
 }
}

/*
 * OPCIÓN 2 DESDE FIREBASE
 * Busca registros usando IDs habituales. Si tu esquema utiliza otros
 * nombres de campos, adapta las listas de abajo a los nombres reales.
 */
function normalizarRegistro(data,key,path){
 if(!data || typeof data!=="object") return null;
 const id=String(data.tmdbId ?? data.tmdb_id ?? data.id_tmdb ?? data.id ?? "");
 const url=data.url ?? data.enlace ?? data.embed ?? data.videoUrl ??
           data.video_url ?? data.url_reproductor ?? data.link ?? "";
 const temporada=Number(data.temporada ?? data.season ?? data.temp ?? 0);
 const episodio=Number(data.episodio ?? data.episode ?? data.capitulo ?? data.cap ?? 0);
 return {data,key,path,id,url,temporada,episodio};
}
function coincideRegistro(reg){
 if(!reg) return false;
 const idBuscado=String(tmdbId||"").replace(/^tmdb_/,"");
 const ids=[reg.id,reg.data.tmdbId,reg.data.tmdb_id,reg.data.id_tmdb,reg.data.idContenido,reg.data.contenidoId]
  .filter(v=>v!==undefined && v!==null).map(String);
 const porId=ids.includes(idBuscado);
 const tituloBuscado=String(contenidoActual?.title||contenidoActual?.name||"").trim().toLowerCase();
 const tituloRegistro=String(reg.data.titulo||reg.data.title||reg.data.nombre||reg.data.name||"").trim().toLowerCase();
 const porTitulo=tituloBuscado && tituloRegistro && tituloBuscado===tituloRegistro;
 if(!porId && !porTitulo) return false;
 if(esSerie){
  const t=Number(reg.data.temporada??reg.data.season??reg.data.temp??temporadaActual);
  const e=Number(reg.data.episodio??reg.data.episode??reg.data.capitulo??reg.data.cap??episodioActual);
  if(reg.temporada && t!==temporadaActual) return false;
  if(reg.episodio && e!==episodioActual) return false;
 }
 return true;
}
async function buscarOpcion2Firebase(){
 const paths=esSerie
  ? ["series_personalizadas","contenido_personalizado"]
  : ["contenido_personalizado","peliculas_personalizadas","series_personalizadas"];
 for(const path of paths){
  try{
   const snap=await db.ref(path).once("value");
   const value=snap.val();
   if(!value) continue;
   const registros=[];
   if(Array.isArray(value)){
    value.forEach((v,i)=>{const r=normalizarRegistro(v,String(i),path);if(r)registros.push(r);});
   }else if(typeof value==="object"){
    Object.entries(value).forEach(([key,v])=>{const r=normalizarRegistro(v,key,path);if(r)registros.push(r);});
   }
   const encontrado=registros.find(coincideRegistro);
   if(encontrado){
    firebaseKeyActual=encontrado.key;
    registroPersonalizado=encontrado.data;
    const d=encontrado.data;
    const url=d.url_op2||d.urlOp2||d.enlace_opcion2||d.opcion2_url||
      d.url_alternativa||d.alternativa||d.url||d.enlace||d.embed||
      d.videoUrl||d.video_url||d.url_reproductor||d.link;
    if(typeof url==="string" && /^https?:\/\//i.test(url)) return url;
   }
  }catch(err){
   console.warn("No se pudo consultar Firebase en",path,err);
  }
 }
 return null;
}

/* METADATOS */
function pintarMetadata(item){
 const titulo=item.title||item.name||item.original_title||item.original_name||"Contenido";
 $("playerTitulo").textContent=titulo;
 const fecha=item.release_date||item.first_air_date||"";
 $("playerAnio").textContent=fecha?fecha.slice(0,4):"Año desconocido";
 $("playerRating").textContent=Number(item.vote_average)>0?Number(item.vote_average).toFixed(1):"N/D";
 $("playerGenero").textContent=(item.genres||[]).slice(0,3).map(g=>g.name).join(" · ")||"";
 $("playerTipo").textContent=esSerie?"📺 Serie":"🎬 Película";
 $("playerSinopsis").textContent=item.overview||"No hay sinopsis disponible.";
 document.title=`${titulo} | TELY`;
}
async function cargarPelicula(){
 const carga=++ultimaCargaId;
 ocultarAlerta();
 actualizarEstado("Consultando información de la película...");
 try{
  const item=await fetchTMDB(`movie/${encodeURIComponent(tmdbId)}`,{language:"es-ES"});
  if(carga!==ultimaCargaId)return;
  contenidoActual=item;pintarMetadata(item);
  actualizarEstado("Preparando opciones de reproducción...");
  const principal=generarEnlaceUnlimplay(tmdbId,"pelicula");
  const alternativa=await buscarOpcion2Firebase();
  if(carga!==ultimaCargaId)return;
  prepararOpciones(principal,alternativa);
  actualizarEstado(opcion2Disponible?"Hay dos opciones de reproducción disponibles.":"Película lista para reproducir.");
  await cargarRecomendaciones("movie");
 }catch(error){
  console.error("Error cargando película:",error);
  mostrarAlerta("No se pudo cargar la información de la película. Comprueba la conexión con la API de TMDB.");
  $("playerTitulo").textContent="No se pudo cargar el contenido";
  $("playerSinopsis").textContent="Inténtalo nuevamente en unos momentos.";
  actualizarEstado("Error de carga: "+(error.message||"sin conexión"));
  const alternativa=await buscarOpcion2Firebase().catch(()=>null);
  if(alternativa) prepararOpciones(alternativa,null);
 }
}

/* SERIES, TEMPORADAS Y EPISODIOS */
async function cargarSerie(){
 const carga=++ultimaCargaId;
 ocultarAlerta();
 actualizarEstado("Consultando información de la serie...");
 try{
  const serie=await fetchTMDB(`tv/${encodeURIComponent(tmdbId)}`,{language:"es-ES"});
  if(carga!==ultimaCargaId)return;
  esSerie=true;contenidoActual=serie;pintarMetadata(serie);
  temporadasActuales=(serie.seasons||[]).filter(s=>Number(s.season_number)>0);
  if(!temporadasActuales.length && serie.seasons?.some(s=>Number(s.season_number)===0)){
   temporadasActuales=serie.seasons.filter(s=>Number(s.season_number)===0);
  }
  $("episodiosSection").style.display="block";
  pintarSelectorTemporadas();
  const existe=temporadasActuales.some(s=>Number(s.season_number)===temporadaActual);
  if(!existe && temporadasActuales.length) temporadaActual=Number(temporadasActuales[0].season_number);
  $("tempSelect").value=String(temporadaActual);
  await cargarEpisodios(temporadaActual,episodioActual);
  await cargarRecomendaciones("tv");
 }catch(error){
  console.error("Error cargando serie:",error);
  mostrarAlerta("No se pudo cargar la serie. Revisa la conexión con TMDB e inténtalo de nuevo.");
  $("playerTitulo").textContent="No se pudo cargar la serie";
  actualizarEstado("Error de carga: "+(error.message||"sin conexión"));
 }
}
function pintarSelectorTemporadas(){
 const select=$("tempSelect");select.innerHTML="";
 temporadasActuales.forEach(temp=>{
  const opt=document.createElement("option");
  opt.value=String(temp.season_number);
  opt.textContent=temp.name||`Temporada ${temp.season_number}`;
  select.appendChild(opt);
 });
}
async function cambiarTempSelect(){
 const t=Number($("tempSelect").value);
 if(!Number.isFinite(t))return;
 temporadaActual=t;episodioActual=1;
 actualizarParametrosURL();
 await cargarEpisodios(t,1);
}
async function cargarEpisodios(numeroTemporada,episodioPreferido){
 const carga=ultimaCargaId;
 const contenedor=$("episodiosList");
 contenedor.innerHTML='<p class="empty">Cargando episodios...</p>';
 actualizarEstado(`Cargando temporada ${numeroTemporada}...`);
 try{
  const datos=await fetchTMDB(`tv/${encodeURIComponent(tmdbId)}/season/${numeroTemporada}`,{language:"es-ES"});
  if(carga!==ultimaCargaId)return;
  episodiosActuales=datos.episodes||[];
  contenedor.innerHTML="";
  if(!episodiosActuales.length){
   contenedor.innerHTML='<p class="empty">No hay episodios disponibles para esta temporada.</p>';
   return;
  }
  episodiosActuales.forEach(ep=>{
   const card=document.createElement("div");
   card.className="episodio-item";
   if(Number(ep.episode_number)===Number(episodioPreferido))card.classList.add("activo");
   const top=document.createElement("div");top.className="ep-top";
   const num=document.createElement("span");num.className="ep-numero";
   num.textContent=`E${String(ep.episode_number).padStart(2,"0")}`;
   const title=document.createElement("span");title.className="ep-titulo";
   title.textContent=ep.name||`Episodio ${ep.episode_number}`;
   const estado=document.createElement("span");estado.className="ep-estado";estado.textContent="▶ Ver";
   top.append(num,title,estado);card.appendChild(top);
   if(ep.overview){
    const sin=document.createElement("p");sin.className="ep-sinopsis";sin.textContent=ep.overview;card.appendChild(sin);
   }
   card.addEventListener("click",()=>seleccionarEpisodio(numeroTemporada,Number(ep.episode_number)));
   contenedor.appendChild(card);
  });
  let elegido=episodiosActuales.find(e=>Number(e.episode_number)===Number(episodioPreferido));
  if(!elegido)elegido=episodiosActuales[0];
  await seleccionarEpisodio(numeroTemporada,Number(elegido.episode_number),false);
  actualizarEstado(`Temporada ${numeroTemporada}: ${episodiosActuales.length} episodios.`);
 }catch(error){
  console.error("Error cargando episodios:",error);
  contenedor.innerHTML='<p class="empty">No se pudieron cargar los episodios. Cambia de temporada o inténtalo de nuevo.</p>';
  mostrarToast("Error cargando episodios","error");
 }
}
async function seleccionarEpisodio(temp,cap,actualizar=true){
 temporadaActual=temp;episodioActual=cap;
 $("tempSelect").value=String(temp);
 [...$("episodiosList").children].forEach(card=>card.classList.remove("activo"));
 const epIndex=episodiosActuales.findIndex(e=>Number(e.episode_number)===cap);
 if(epIndex>=0 && $("episodiosList").children[epIndex]) $("episodiosList").children[epIndex].classList.add("activo");
 if(actualizar)actualizarParametrosURL();
 actualizarEstado(`Preparando temporada ${temp}, episodio ${cap}...`);
 const principal=generarEnlaceUnlimplay(tmdbId,"serie",temp,cap);
 const alternativa=await buscarOpcion2Firebase();
 prepararOpciones(principal,alternativa);
 $("playerTipo").textContent=`📺 T${temp} · E${cap}`;
}
function actualizarParametrosURL(){
 const u=new URL(location.href);
 u.searchParams.set("play",tmdbId);
 u.searchParams.set("tipo",esSerie?"serie":"pelicula");
 if(esSerie){u.searchParams.set("temp",temporadaActual);u.searchParams.set("cap",episodioActual);}
 history.replaceState({}, "",u);
}

/* RECOMENDACIONES */
async function cargarRecomendaciones(tipoContenido){
 const box=$("recomendaciones");
 box.innerHTML='<span class="empty">Buscando recomendaciones...</span>';
 try{
  const data=await fetchTMDB(`${tipoContenido}/${encodeURIComponent(tmdbId)}/recommendations`,{language:"es-ES"});
  recomendacionesActuales=(data.results||[]).filter(x=>x.poster_path).slice(0,15);
  box.innerHTML="";
  if(!recomendacionesActuales.length){
   box.innerHTML='<span class="empty">No hay recomendaciones disponibles.</span>';return;
  }
  recomendacionesActuales.forEach(item=>{
   const card=document.createElement("article");card.className="recomendacion";
   const img=document.createElement("img");img.src=getImagenUrl(item.poster_path);img.alt=item.title||item.name||"Portada";img.loading="lazy";
   const p=document.createElement("p");p.textContent=item.title||item.name||"Ver contenido";
   card.append(img,p);
   card.addEventListener("click",()=>{
    const url=new URL("reproductor.html",location.href);
    url.searchParams.set("play",item.id);
    url.searchParams.set("tipo",tipoContenido==="tv"?"serie":"pelicula");
    location.href=url.href;
   });
   box.appendChild(card);
  });
 }catch(error){
  console.warn("Recomendaciones no disponibles:",error);
  box.innerHTML='<span class="empty">No se pudieron cargar las recomendaciones.</span>';
 }
}

/* REPORTES Y AYUDA */
async function reportarFalla(){

 const descripcion=prompt("Describe brevemente el problema con la reproducción:");
 if(!descripcion||!descripcion.trim())return;
 const reporte={
  contenidoId:String(tmdbId||""),
  titulo:contenidoActual?.title||contenidoActual?.name||$("playerTitulo").textContent,
  tipo:esSerie?"serie":"pelicula",
  temporada:esSerie?temporadaActual:null,
  episodio:esSerie?episodioActual:null,
  opcion:opcionActiva,
  descripcion:descripcion.trim(),
  uid:user?.uid||null,
  email:user?.email||null,
  fecha:Date.now(),
  estado:"pendiente"
 };
 try{
  await db.ref("reportes_reproduccion").push(reporte);
  mostrarToast("Reporte enviado. Gracias.","success");
 }catch(error){
  console.error(error);
  mostrarToast("No se pudo guardar el reporte. Contacta al administrador.","error");
 }
}

/* ARRANQUE */
async function iniciar(){
 if(!tmdbId){
  $("playerTitulo").textContent="Contenido no especificado";
  $("playerSinopsis").textContent="Vuelve al catálogo y selecciona una película o serie.";
  $("playerWrapper").innerHTML='<div class="player-placeholder"><i class="fas fa-film"></i><p>No se recibió el identificador del contenido.<br>Abre este reproductor desde el catálogo de TELY.</p></div>';
  actualizarEstado("Falta el parámetro play en la dirección.");
  return;
 }
 try{
  if(esSerie)await cargarSerie();
  else await cargarPelicula();
 }catch(error){
  console.error("Error inesperado:",error);
  mostrarAlerta("Ocurrió un error inesperado al iniciar el reproductor.");
  actualizarEstado(error.message||"Error inesperado.");
 }
}
